<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLDVORTEX™ Admin Login</title><link rel="stylesheet" href="./style.css">
</head>
<body>
<section class="view"><div class="card login-card">
<div class="brand"><span>G</span> GOLDVORTEX</div>
<div class="eyebrow">ADMINISTRATOR</div>
<h1>Secure Login</h1>
<p class="muted">Sign in to manage customers, licenses and MT5 monitoring.</p>
<form id="loginForm">
<label>Email<input id="email" type="email" required autocomplete="username"></label>
<label>Password<input id="password" type="password" required autocomplete="current-password"></label>
<button class="primary" type="submit">LOGIN</button>
<div id="msg" class="msg"></div>
</form>
<a href="../index.html" class="muted small">← Back to GOLDVORTEX</a>
</div></section>
<script>
const form=document.getElementById('loginForm'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const b=e.submitter;b.disabled=true;b.textContent='SIGNING IN...';msg.textContent='';msg.className='msg';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:emailInput.value.trim().toLowerCase(),password:passwordInput.value}),cache:'no-store'});
    const raw=await r.text();let d=null;try{d=raw?JSON.parse(raw):null}catch(_){}
    if(!d)throw new Error(r.ok?'API returned an empty or invalid response.':`API_ERROR_${r.status}`);
    if(!r.ok||!d.success)throw new Error(d.error||d.message||`LOGIN_FAILED_${r.status}`);
    if(!d.token)throw new Error('LOGIN_TOKEN_MISSING');
    localStorage.setItem('gvx_admin_session',d.token);localStorage.setItem('gvx_admin_user',JSON.stringify(d.user||{}));location.replace('index.html');
  }catch(err){msg.textContent=err.message||'LOGIN_FAILED';msg.className='msg error'}
  finally{b.disabled=false;b.textContent='LOGIN'}
});
</script>
</body></html>
