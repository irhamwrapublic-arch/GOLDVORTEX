<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLDVORTEX™ Admin Login</title><link rel="stylesheet" href="./style.css"></head><body><section class="view"><div class="card login-card"><div class="brand"><span>G</span> GOLDVORTEX</div><div class="eyebrow">ADMINISTRATOR</div><h1>Secure Login</h1><p class="muted">Sign in to manage customers, licenses and MT5 monitoring.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">LOGIN</button><div id="msg" class="msg"></div></form><a href="../index.html" class="muted small">← Back to GOLDVORTEX</a></div></section><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),b=e.submitter;b.disabled=true;b.textContent='SIGNING IN...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim().toLowerCase(),password:password.value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'LOGIN_FAILED');localStorage.setItem('gvx_admin_session',d.token);location.href='index.html'}catch(err){msg.textContent=err.message;msg.className='msg error'}finally{b.disabled=false;b.textContent='LOGIN'}})</script></body></html>
