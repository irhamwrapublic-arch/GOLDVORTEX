name = "goldvortex-api"
main = "worker/worker.js"
compatibility_date = "2026-08-18"

# Route the GOLDVORTEX API through this Worker.
# Without this route, /api/* is handled by the frontend Pages site.
routes = [
  { pattern = "goldvortex.web.id/api/*", zone_name = "goldvortex.web.id" }
]

[[d1_databases]]
binding = "DB"
database_name = "goldvortex_license"
database_id = "e40b6ff6-aefb-462b-ba2d-adddcbefbf076"

[vars]
PUBLIC_APP_URL = "https://goldvortex.web.id"

# Secrets are NOT stored in this file.
# Configure with:
# wrangler secret put RESEND_API_KEY
# wrangler secret put ADMIN_BOOTSTRAP_SECRET
